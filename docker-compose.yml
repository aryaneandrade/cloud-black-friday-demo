services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: NovaStore
      COUNTDOWN_SECONDS: 10
      STORE_CONFIG_PATH: /app/data/store.json
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
